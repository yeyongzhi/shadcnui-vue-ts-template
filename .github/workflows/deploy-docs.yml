# 文档站自动部署：push 到 main 时构建 VitePress 并发布到 GitHub Pages
# 首次使用需在仓库 Settings → Pages → Build and deployment → Source 选择 "GitHub Actions"
name: Deploy docs site

on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages 部署所需权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一次部署，新推送取消进行中的旧部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        # 版本从 package.json 的 packageManager 字段读取

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build demo SPA
        run: npx vite build --config docs/vite.demo.config.ts

      - name: Build docs
        env:
          # GitHub Pages 子路径：<user>.github.io/<repo>/
          DOCS_BASE: /${{ github.event.repository.name }}/
        run: pnpm run docs:build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
